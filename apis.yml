aid: bloomon
name: Bloomon
description: 'Bloomon is a flower and gift delivery service that lets customers order
  one-off bouquets or sign up for a recurring flower subscription delivered on a chosen
  cadence. It offers seasonal hand-tied and letterbox arrangements, gifting options,
  gift vouchers, and add-ons, with delivery across the United Kingdom and other European
  markets. Bloomon is part of the Bloom & Wild Group (confirmed via its published
  .well-known/security.txt, which points to bloomandwild.com). The company operates
  a consumer-facing e-commerce and subscription website rather than a public developer
  API; this API Evangelist profile therefore captures its web, security, and discovery
  surface rather than a machine-readable API.'
